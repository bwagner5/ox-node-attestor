{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attestor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "attestor.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.additionalAnnotations .Values.serviceAccount.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
