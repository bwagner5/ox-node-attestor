apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "attestor.fullname" . }}-platform-roots
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "attestor.labels" . | nindent 4 }}
data:
  roots.pem: |
    {{- required "settings.platformRoots is required" .Values.settings.platformRoots | nindent 4 }}
