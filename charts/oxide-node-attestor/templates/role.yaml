{{- if and .Values.rbac.create (eq .Values.settings.issuer "token") -}}
# Bootstrap tokens are Secrets in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "attestor.fullname" . }}
  namespace: kube-system
  labels:
    {{- include "attestor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "attestor.fullname" . }}
  namespace: kube-system
  labels:
    {{- include "attestor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "attestor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "attestor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
