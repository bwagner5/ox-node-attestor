apiVersion: v1
kind: Service
metadata:
  name: {{ include "attestor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "attestor.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.additionalAnnotations .Values.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "attestor.selectorLabels" . | nindent 4 }}
